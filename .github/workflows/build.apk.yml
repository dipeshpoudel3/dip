      - name: Find Android Gradle Project
        run: |
          find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -not -path "*/.gradle/*"

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -not -path "*/.gradle/*" | head -n 1)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi

          echo "Building from: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug
